<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> وحش الحقن B | CLEANER </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #020617; color: #e2e8f0; }
        .input-box { background: #0f172a; border: 2px solid #1e293b; padding: 15px; border-radius: 12px; width: 100%; color: white; margin-bottom: 10px; }
        .label-style { display: block; margin-bottom: 8px; font-weight: bold; color: #3b82f6; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-2xl mx-auto bg-slate-900/80 p-6 rounded-3xl border border-blue-900/30">
        <h1 class="text-3xl font-black text-center text-blue-500 mb-8 italic">نظام الحقن الاحترافي V4 ⚡</h1>

        <label class="label-style">بيانات الربط (Token & Repo):</label>
        <input id="gh-token" type="password" class="input-box" placeholder="التوكن السري (ghp_...)">
        <input id="gh-repo" type="text" value="medo7788/Archive-" class="input-box" dir="ltr">

        <hr class="border-slate-800 my-6">

        <label class="label-style">محتوى المقال (سيتم تنظيفه تلقائياً):</label>
        <input id="p-title" type="text" class="input-box" placeholder="عنوان المقال">
        <input id="p-img" type="text" class="input-box text-sm" placeholder="رابط الصورة (Top4Top)">
        <textarea id="p-body" rows="8" class="input-box" placeholder="الصق المقال هنا..."></textarea>

        <label class="label-style">كود الإعلان (أرباحك هنا 💰):</label>
        <textarea id="p-ads" rows="3" class="input-box border-emerald-900/50" placeholder="ضع كود Adsterra أو Adsense هنا..."></textarea>

        <div class="bg-blue-950/20 p-4 rounded-xl mb-6">
            <label class="label-style">معالج الأسئلة الذكي:</label>
            <textarea id="raw-faq" rows="4" class="input-box bg-black text-xs" placeholder="السؤال\nالإجابة"></textarea>
            <button onclick="magicProcess()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">1. تنظيف وتجهيز البيانات ✨</button>
        </div>

        <textarea id="p-faq-final" class="hidden"></textarea>

        <button onclick="launch()" id="launch-btn" class="w-full py-6 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black text-2xl rounded-2xl shadow-xl active:scale-95 transition-all">2. حـقـن المـقـال الآن 🔥🚀</button>
        <p id="msg" class="text-center mt-4 font-bold"></p>
    </div>

    <script>
        function cleanText(text) {
            // كود العفريت: تنظيف علامات الماركدوان الزائدة والرموز الغريبة
            return text.replace(/[~*_#`]/g, '').replace(/\[.*?\]/g, '').trim();
        }

        function magicProcess() {
            // تنظيف المقال والأسئلة
            const body = document.getElementById('p-body');
            body.value = cleanText(body.value);
            
            const rawFaq = document.getElementById('raw-faq').value;
            const lines = rawFaq.split('\n').filter(l => l.trim() !== "");
            let faqs = [];
            for (let i = 0; i < lines.length; i += 2) {
                if (lines[i] && lines[i+1]) {
                    faqs.push({ q: cleanText(lines[i]), a: cleanText(lines[i+1]) });
                }
            }
            document.getElementById('p-faq-final').value = JSON.stringify(faqs);
            alert("تم تنظيف النص ومعالجة الأسئلة بنجاح!");
        }

        async function launch() {
            const btn = document.getElementById('launch-btn');
            const msg = document.getElementById('msg');
            const adsCode = btoa(unescape(encodeURIComponent(document.getElementById('p-ads').value)));
            
            const config = {
                token: document.getElementById('gh-token').value,
                repo: document.getElementById('gh-repo').value,
                title: document.getElementById('p-title').value,
                img: document.getElementById('p-img').value,
                body: document.getElementById('p-body').value,
                faq: document.getElementById('p-faq-final').value,
                ads: adsCode
            };

            if(!config.token || !config.title) return alert("يا جنرال، البيانات ناقصة!");

            btn.disabled = true;
            msg.innerText = "⏳ جاري الحقن المباشر...";

            const fileName = `post-${Date.now()}.md`;
            const content = `---
title: "${config.title}"
image: "${config.img}"
ads: "${config.ads}"
faq: ${config.faq || '[]'}
---
${config.body}`;

            try {
                const res = await fetch(`https://api.github.com/repos/${config.repo}/contents/content/posts/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `SEO Injection: ${config.title}`,
                        content: btoa(unescape(encodeURIComponent(content)))
                    })
                });
                if(res.ok) { msg.innerText = "✅ تمت العملية بنجاح!"; msg.className="text-emerald-500"; }
            } catch (e) {
                msg.innerText = "❌ فشل الحقن!"; msg.className="text-red-500";
            } finally { btn.disabled = false; }
        }
    </script>
</body>
</html>

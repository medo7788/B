<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Matrix Injection B-V5 - نظام الحقن الاستراتيجي الذكي للمحتوى">
    <meta name="theme-color" content="#020617">
    <title>Matrix Injection B-V5 | وحش الحقن الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Poppins:wght@300;400;500;600;700;900&family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1e40af;
            --bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.6);
        }
        body {
            font-family: 'Cairo', 'Poppins', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.05), transparent),
                              radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.05), transparent);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        input, textarea {
            background: rgba(2, 6, 23, 0.8) !important;
            border: 1px solid rgba(59, 130, 246, 0.2) !important;
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15) !important;
        }
        .matrix-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .matrix-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
        }
        .matrix-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-6xl font-black text-white italic tracking-tighter mb-4">
                MATRIX <span class="text-blue-500">B-V5</span>
            </h1>
            <p class="text-slate-500 font-mono tracking-widest uppercase text-xs">Strategic Content Injection System</p>
        </div>

        <div class="glass-card rounded-3xl p-6 md:p-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 pb-8 border-b border-slate-800/50">
                <div>
                    <label class="block text-sm font-medium text-blue-400 mb-2">GitHub Personal Token</label>
                    <input type="password" id="gh-token" class="w-full rounded-xl px-4 py-3 text-white focus:outline-none" placeholder="ghp_xxxxxxxxxxxx">
                </div>
                <div>
                    <label class="block text-sm font-medium text-blue-400 mb-2">Repository Path</label>
                    <input type="text" id="gh-repo" value="medo7788/Archive-" class="w-full rounded-xl px-4 py-3 text-white focus:outline-none" dir="ltr">
                </div>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">عنوان المقال الاستراتيجي</label>
                    <input type="text" id="p-title" class="w-full rounded-xl px-4 py-3 text-white text-lg font-bold focus:outline-none" placeholder="أدخل العنوان هنا...">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">القسم (Category)</label>
                        <input type="text" id="p-category" class="w-full rounded-xl px-4 py-3 text-white focus:outline-none" placeholder="مثلاً: ذكاء اصطناعي">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-2">رابط صورة الغلاف (Top4Top)</label>
                        <input type="text" id="p-img" class="w-full rounded-xl px-4 py-3 text-white focus:outline-none" placeholder="https://top4top.io/...">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">جسم المقال (تحليل البيانات)</label>
                    <textarea id="p-body" rows="10" class="w-full rounded-xl px-4 py-3 text-white focus:outline-none" placeholder="أدخل محتوى المقال هنا..."></textarea>
                    <div class="mt-2 text-right text-xs text-slate-500" id="char-count">0 حرف</div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-yellow-500 mb-2">كود الإعلانات (Adsterra / Adsense)</label>
                    <textarea id="p-ads" rows="3" class="w-full rounded-xl px-4 py-3 text-white focus:outline-none border-yellow-900/20" placeholder="ضع كود الإعلان هنا..."></textarea>
                </div>

                <div class="bg-slate-900/40 p-6 rounded-2xl border border-blue-900/20">
                    <label class="block text-sm font-medium text-blue-400 mb-4 italic underline">معالج الأسئلة الشائعة (FAQ)</label>
                    <textarea id="raw-faq" rows="4" class="w-full rounded-xl px-4 py-3 text-white text-xs font-mono mb-4" placeholder="السؤال هنا&#10;الإجابة هنا (كل منهما في سطر)"></textarea>
                    <button onclick="processData()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-blue-400 font-bold rounded-xl transition-all">
                        1. تصفية النص ومعالجة البيانات ✨
                    </button>
                </div>

                <input type="hidden" id="p-faq-final">

                <button onclick="launchInjection()" id="launch-btn" class="matrix-btn w-full py-6 text-white font-black text-2xl rounded-2xl mt-8 shadow-xl">
                    2. إطلاق عملية الحقن الآن 🔥🚀
                </button>

                <div id="status-msg" class="hidden mt-6 p-4 rounded-xl text-center font-bold"></div>
            </div>
        </div>
    </div>

    <script>
        // دالة التنظيف وحماية الـ DNA
        function cleanString(str) {
            return str.replace(/[~*_#`]/g, '').replace(/"/g, "'").trim();
        }

        function processData() {
            const body = document.getElementById('p-body');
            body.value = body.value.replace(/\n\n+/g, '\n\n').trim();
            
            const rawFaq = document.getElementById('raw-faq').value;
            const lines = rawFaq.split('\n').filter(l => l.trim() !== "");
            let faqs = [];
            for (let i = 0; i < lines.length; i += 2) {
                if (lines[i] && lines[i+1]) {
                    faqs.push({ 
                        q: cleanString(lines[i]), 
                        a: cleanString(lines[i+1]) 
                    });
                }
            }
            document.getElementById('p-faq-final').value = JSON.stringify(faqs);
            showStatus("✅ تم تطهير البيانات وجاهزة للحقن", "success");
        }

        function showStatus(text, type) {
            const msg = document.getElementById('status-msg');
            msg.innerText = text;
            msg.className = `mt-6 p-4 rounded-xl text-center font-bold block ${type === 'success' ? 'bg-emerald-900/20 text-emerald-400' : 'bg-red-900/20 text-red-400'}`;
        }

        async function launchInjection() {
            const btn = document.getElementById('launch-btn');
            const config = {
                token: document.getElementById('gh-token').value,
                repo: document.getElementById('gh-repo').value,
                title: document.getElementById('p-title').value,
                category: document.getElementById('p-category').value || "عام",
                img: document.getElementById('p-img').value,
                body: document.getElementById('p-body').value,
                ads: btoa(unescape(encodeURIComponent(document.getElementById('p-ads').value))),
                faq: document.getElementById('p-faq-final').value || "[]"
            };

            if (!config.token || !config.title) {
                return showStatus("❌ خطأ: التوكن والعنوان ضروريان!", "danger");
            }

            btn.disabled = true;
            btn.innerText = "⏳ جاري الاختراق والحقن...";

            const fileName = `post-${Date.now()}.md`;
            // هيكل YAML مؤمن بنسبة 100%
            const fileContent = `---
title: "${cleanString(config.title)}"
category: "${cleanString(config.category)}"
image: "${config.img}"
ads: "${config.ads}"
faq: ${config.faq}
---
${config.body}`;

            try {
                const response = await fetch(`https://api.github.com/repos/${config.repo}/contents/content/posts/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Elite Injection: ${config.title}`,
                        content: btoa(unescape(encodeURIComponent(fileContent)))
                    })
                });

                if (response.ok) {
                    showStatus("✅ تم الحقن بنجاح! المقال الآن تحت سيطرتك.", "success");
                    btn.innerText = "2. إطلاق عملية الحقن الآن 🔥🚀";
                } else {
                    const err = await response.json();
                    showStatus(`❌ فشل: ${err.message}`, "danger");
                }
            } catch (e) {
                showStatus("❌ خطأ في الاتصال بالسيرفر", "danger");
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('p-body').addEventListener('input', (e) => {
            document.getElementById('char-count').innerText = e.target.value.length + " حرف";
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Matrix C2 | المحول الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background: #020617; }</style>
</head>
<body class="text-slate-300 p-4">
    <div class="max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
        <h1 class="text-2xl font-black text-white mb-6 border-b border-slate-800 pb-4 text-center text-blue-500">غرفة التحكم الذكية 2026</h1>
        
        <div class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="gh-token" type="password" placeholder="GitHub Token (ghp_...)" class="bg-black border border-slate-700 p-3 rounded-xl outline-none focus:border-blue-500">
                <input id="gh-repo" type="text" placeholder="username/repository-a" class="bg-black border border-slate-700 p-3 rounded-xl outline-none text-left" dir="ltr">
            </div>

            <input id="p-title" type="text" placeholder="عنوان المقال" class="w-full bg-black border border-slate-700 p-3 rounded-xl outline-none">
            <input id="p-img" type="text" placeholder="رابط صورة Top4Top" class="w-full bg-black border border-slate-700 p-3 rounded-xl outline-none">
            <textarea id="p-body" rows="8" placeholder="الصق نص المقال هنا..." class="w-full bg-black border border-slate-700 p-3 rounded-xl outline-none text-sm font-mono"></textarea>

            <div class="bg-slate-800/50 p-4 rounded-2xl border border-blue-900/30">
                <label class="block text-xs font-bold text-blue-400 mb-2">معالج الأسئلة (الصق الأسئلة والأجوبة ورا بعض):</label>
                <textarea id="raw-faq" rows="5" class="w-full bg-black border border-slate-700 p-3 rounded-xl outline-none text-[10px]" placeholder="1. السؤال؟
الجواب...
2. السؤال؟
الجواب..."></textarea>
                <button onclick="magicFAQ()" class="mt-2 text-xs bg-blue-600 px-4 py-2 rounded-lg font-bold text-white">تحويل الأسئلة لـ JSON أوتوماتيكياً ✨</button>
            </div>

            <textarea id="p-faq-final" class="hidden"></textarea>

            <button onclick="launch()" id="launch-btn" class="w-full py-5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black text-xl rounded-2xl shadow-xl transform active:scale-95 transition-all">نشر المقال (الحقن المباشر) 🚀</button>
            <p id="msg" class="text-center font-bold mt-4"></p>
        </div>
    </div>

    <script>
        // دالة تحويل الأسئلة "بنت العفريت"
        function magicFAQ() {
            const raw = document.getElementById('raw-faq').value;
            const lines = raw.split('\n').filter(line => line.trim() !== "");
            let faqs = [];
            for (let i = 0; i < lines.length; i += 2) {
                if (lines[i] && lines[i+1]) {
                    faqs.push({
                        q: lines[i].replace(/^\d+\.\s*/, "").trim(),
                        a: lines[i+1].trim()
                    });
                }
            }
            document.getElementById('p-faq-final').value = JSON.stringify(faqs);
            alert("تم تحويل " + faqs.length + " سؤال بنجاح! جاهز للنشر.");
        }

        async function launch() {
            const btn = document.getElementById('launch-btn');
            const msg = document.getElementById('msg');
            const config = {
                token: document.getElementById('gh-token').value,
                repo: document.getElementById('gh-repo').value,
                title: document.getElementById('p-title').value,
                img: document.getElementById('p-img').value,
                body: document.getElementById('p-body').value,
                faq: document.getElementById('p-faq-final').value
            };

            if(!config.token || !config.title) return alert("البيانات ناقصة!");

            btn.disabled = true;
            msg.innerText = "⏳ جاري الاختراق والنشر...";
            msg.className = "text-yellow-500 text-center";

            const fileName = `post-${Date.now()}.md`;
            const content = `---
title: "${config.title}"
image: "${config.img}"
date: "${new Date().toLocaleDateString('ar-EG')}"
faq: ${config.faq || '[]'}
---
${config.body}`;

            try {
                const res = await fetch(`https://api.github.com/repos/${config.repo}/contents/content/posts/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `SEO Launch: ${config.title}`,
                        content: btoa(unescape(encodeURIComponent(content)))
                    })
                });
                if(res.ok) {
                    msg.innerText = "✅ تم النشر بنجاح! روح شوف المستودع A";
                    msg.className = "text-emerald-500 text-center font-bold";
                } else { throw new Error(); }
            } catch (e) {
                msg.innerText = "❌ فشل! تأكد من التوكن وإعدادات المستودع A.";
                msg.className = "text-red-500 text-center";
            } finally { btn.disabled = false; }
        }
    </script>
</body>
</html>
